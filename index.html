<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran TOEFL Mandiri</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #34495e; }
        input, select { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #3498db; outline: none; }
        
        .quota-info { font-size: 13px; margin-top: 5px; font-weight: bold; }
        .quota-available { color: #27ae60; }
        .quota-full { color: #e74c3c; }
        
        .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .radio-item { display: flex; align-items: center; padding: 10px; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .radio-item:hover { background-color: #f9f9f9; }
        .radio-item.disabled { background-color: #f2f2f2; color: #999; cursor: not-allowed; border-color: #e74c3c; }
        .radio-item input { width: auto; margin-right: 10px; }
        
        button { width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1f618d; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        
        #message { margin-top: 15px; padding: 10px; border-radius: 5px; text-align: center; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { text-align: center; color: #7f8c8d; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Pendaftaran TOEFL</h2>
    <form id="toeflForm">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" required placeholder="Masukkan nama lengkap">
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" name="nim" required placeholder="Contoh: 12345678">
        </div>
        <div class="form-group">
            <label>Email Aktif</label>
            <input type="email" name="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
            <label>Jenis Tes</label>
            <select name="jenisTes" required>
                <option value="">-- Pilih Jenis Tes --</option>
                <option value="TOEFL">TOEFL</option>
                <option value="TOAFL">TOAFL</option>
            </select>
        </div>
        <div class="form-group">
            <label>Jadwal Ujian</label>
            <select name="jadwal" required>
                <option value="">-- Pilih Hari --</option>
                <option value="Kamis">Kamis</option>
                <option value="Jumat">Jumat</option>
            </select>
        </div>
        <div class="form-group">
            <label>Pilih Sesi Ujian</label>
            <div class="radio-group" id="sessionGroup">
                <label class="radio-item" id="label-sesi1">
                    <input type="radio" name="sesi" value="Sesi 1" required> 
                    Sesi 1 (08.00 - 09.30) <span class="quota-info" id="quota-sesi1">Memuat...</span>
                </label>
                <label class="radio-item" id="label-sesi2">
                    <input type="radio" name="sesi" value="Sesi 2" required> 
                    Sesi 2 (10.30 - 12.00) <span class="quota-info" id="quota-sesi2">Memuat...</span>
                </label>
                <label class="radio-item" id="label-sesi3">
                    <input type="radio" name="sesi" value="Sesi 3" required> 
                    Sesi 3 (14.00 - 15.30) <span class="quota-info" id="quota-sesi3">Memuat...</span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <label>No. Telepon / WhatsApp</label>
            <input type="tel" name="noTelpon" required placeholder="Contoh: 081234567890">
        </div>
        
        <button type="submit" id="submitBtn">Daftar Sekarang</button>
        <div class="loading" id="loadingText">Sedang memproses pendaftaran...</div>
        <div id="message"></div>
    </form>
</div>

<script>
    // GANTI URL INI DENGAN URL WEB APP DARI LANGKAH 2
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwlXXs0-4iQ1WzAJ5oO2LsVMF5dGyFWxYmO0Zrs2doIG6LC_eAwyCH65B_V5SP1WC7yeA/exec'; 

    // Fungsi untuk mengambil data kuota saat halaman dimuat
    async function loadQuota() {
        try {
            const response = await fetch(SCRIPT_URL);
            const counts = await response.json();
            const maxQuota = 3; // Sesuaikan dengan MAX_QUOTA di Apps Script

            updateSessionUI('Sesi 1', counts['Sesi 1'], maxQuota);
            updateSessionUI('Sesi 2', counts['Sesi 2'], maxQuota);
            updateSessionUI('Sesi 3', counts['Sesi 3'], maxQuota);
        } catch (error) {
            console.error('Gagal memuat kuota:', error);
            document.querySelectorAll('.quota-info').forEach(el => el.innerText = '(Gagal memuat)');
        }
    }

    function updateSessionUI(sessionName, currentCount, maxQuota) {
        const remaining = maxQuota - currentCount;
        const quotaText = document.getElementById(`quota-${sessionName.toLowerCase().replace(' ', '')}`);
        const label = document.getElementById(`label-${sessionName.toLowerCase().replace(' ', '')}`);
        const radio = label.querySelector('input[type="radio"]');

        if (remaining <= 0) {
            quotaText.innerText = `Penuh (${currentCount}/${maxQuota}) - Silakan cek jadwal lain`;
            quotaText.className = 'quota-info quota-full';
            label.classList.add('disabled');
            radio.disabled = true; // Nonaktifkan pilihan
        } else {
            quotaText.innerText = `Sisa kuota: ${remaining}/${maxQuota}`;
            quotaText.className = 'quota-info quota-available';
        }
    }

    // Handle Form Submission
    document.getElementById('toeflForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const loadingText = document.getElementById('loadingText');
        const messageDiv = document.getElementById('message');
        
        // UI Loading state
        submitBtn.disabled = true;
        submitBtn.innerText = 'Memproses...';
        loadingText.style.display = 'block';
        messageDiv.style.display = 'none';

        const formData = {
            nama: this.nama.value,
            nim: this.nim.value,
            email: this.email.value,
            jenisTes: this.jenisTes.value,
            jadwal: this.jadwal.value,
            sesi: this.sesi.value,
            noTelpon: this.noTelpon.value
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(formData)
            });
            
            const result = await response.json();
            
            messageDiv.style.display = 'block';
            if (result.status === 'success') {
                messageDiv.className = 'success';
                messageDiv.innerText = result.message;
                document.getElementById('toeflForm').reset();
                loadQuota(); // Refresh kuota setelah berhasil daftar
            } else {
                messageDiv.className = 'error';
                messageDiv.innerText = result.message; // Akan menampilkan "Silakan cek jadwal lain"
            }
        } catch (error) {
            messageDiv.style.display = 'block';
            messageDiv.className = 'error';
            messageDiv.innerText = 'Terjadi kesalahan jaringan. Silakan coba lagi.';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Daftar Sekarang';
            loadingText.style.display = 'none';
        }
    });

    // Muat kuota saat halaman dibuka
    loadQuota();
</script>

</body>
</html>
